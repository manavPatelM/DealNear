name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ─── API Gateway (Node.js) ────────────────────────────────
  api-gateway:
    name: api-gateway / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests
        run: node --test

  # ─── Identity Service (Java / Spring Boot) ────────────────
  identity-service:
    name: identity-service / build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-surefire
          path: services/identity-service/target/surefire-reports/

  # ─── Vendor Service (Java / Spring Boot) ─────────────────
  vendor-service:
    name: vendor-service / build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vendor-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-service-surefire
          path: services/vendor-service/target/surefire-reports/

  # ─── Offer Service (Java / Spring Boot) ──────────────────
  offer-service:
    name: offer-service / build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/offer-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offer-service-surefire
          path: services/offer-service/target/surefire-reports/

  # ─── Discovery Service (Java / Spring Boot) ──────────────
  discovery-service:
    name: discovery-service / build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/discovery-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-service-surefire
          path: services/discovery-service/target/surefire-reports/

  # ─── Frontend (React / Vite) ──────────────────────────────
  frontend:
    name: frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

  # ─── Summary gate ─────────────────────────────────────────
  # Lets branch protection reference a single required status check
  ci-pass:
    name: CI passed
    if: always()
    needs:
      - api-gateway
      - identity-service
      - vendor-service
      - offer-service
      - discovery-service
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
          echo "All CI jobs passed."
